services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      TZ: ${APP_TIMEZONE:-Europe/Paris}
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ${BALAFON_HOST_MEDIA_ROOT:-./storage/app}:${BALAFON_CONTAINER_MEDIA_ROOT:-/media-library}
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      TZ: ${APP_TIMEZONE:-Europe/Paris}
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      TZ: ${APP_TIMEZONE:-Europe/Paris}
    working_dir: /var/www/html
    command: php artisan queue:listen redis --sleep=1 --tries=1 --timeout=120
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    environment:
      TZ: ${APP_TIMEZONE:-Europe/Paris}
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  vite:
    image: node:22-alpine
    environment:
      TZ: ${APP_TIMEZONE:-Europe/Paris}
      VITE_PORT: ${VITE_PORT:-5173}
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port ${VITE_PORT:-5173}"
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    volumes:
      - ./:/var/www/html
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      TZ: ${APP_TIMEZONE:-Europe/Paris}
      POSTGRES_DB: balafon
      POSTGRES_USER: balafon
      POSTGRES_PASSWORD: balafon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    environment:
      TZ: ${APP_TIMEZONE:-Europe/Paris}
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    environment:
      TZ: ${APP_TIMEZONE:-Europe/Paris}
    ports:
      - "18025:8025"
      - "1025:1025"

volumes:
  postgres_data:
